<section class="mx-auto max-w-[1720px] px-4 py-7 sm:px-6 lg:px-8" aria-labelledby="trending-now-title">
  <div class="mb-5 flex items-end justify-between gap-4">
    <div>
      <h2 id="trending-now-title" class="text-2xl font-bold tracking-normal text-white sm:text-3xl">Trending Now</h2>
      <p class="mt-1.5 text-sm text-yg-muted">What's popular in the YG Fandom right now.</p>
    </div>

    <a
      routerLink="/shop/products"
      class="hidden items-center gap-1.5 rounded-md px-2 py-1.5 text-xs font-semibold text-yg-purple-200 transition hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400 sm:inline-flex"
      aria-label="View all merchandise">
      View all
      <lucide-icon name="arrow-right" [size]="15" aria-hidden="true"></lucide-icon>
    </a>
  </div>

  <div class="-mx-4 flex snap-x gap-3 overflow-x-auto px-4 pb-2 sm:-mx-6 sm:px-6 md:grid md:grid-cols-3 md:overflow-visible lg:grid-cols-6 xl:grid-cols-8 lg:mx-0 lg:px-0">
    <app-product-card
      *ngFor="let product of products"
      class="min-w-[10.75rem] snap-start md:min-w-0"
      [product]="product"
      (addToCart)="addToCart.emit($event)"
      (wishlist)="wishlist.emit($event)">
    </app-product-card>
  </div>
</section>
