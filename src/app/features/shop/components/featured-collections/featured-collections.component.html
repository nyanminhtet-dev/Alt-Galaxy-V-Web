<section class="mx-auto max-w-[1720px] px-4 py-4 sm:px-6 lg:px-8" aria-labelledby="featured-collections-title">
  <div class="mb-3 flex items-end justify-between gap-4">
    <h2 id="featured-collections-title" class="text-xl font-bold text-white">Featured Collections</h2>
    <button
      type="button"
      class="hidden items-center gap-1.5 rounded-md px-2 py-1.5 text-xs font-semibold text-white transition hover:text-yg-purple-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400 sm:inline-flex">
      View all
      <lucide-icon name="arrow-right" [size]="15" aria-hidden="true"></lucide-icon>
    </button>
  </div>

  <div class="-mx-4 flex snap-x gap-3 overflow-x-auto px-4 pb-2 sm:-mx-6 sm:px-6 lg:mx-0 lg:grid lg:grid-cols-5 lg:overflow-visible lg:px-0">
    <app-collection-card
      *ngFor="let collection of collections"
      class="min-w-[15.5rem] snap-start lg:min-w-0"
      [collection]="collection"
      (collectionSelected)="collectionSelected.emit($event)">
    </app-collection-card>
  </div>
</section>
