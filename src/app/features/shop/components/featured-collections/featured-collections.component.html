<section class="mx-auto max-w-[1720px] px-4 py-7 sm:px-6 lg:px-8" aria-labelledby="featured-collections-title">
  <div class="mb-5 flex items-end justify-between gap-4">
    <div>
      <h2 id="featured-collections-title" class="text-xl font-bold tracking-normal text-white">Featured Collections</h2>
      <p class="mt-1 text-xs text-yg-muted">Curated drops, special editions, and exclusive merchandise.</p>
    </div>
    <button
      type="button"
      class="hidden items-center gap-1.5 rounded-md px-2 py-1.5 text-xs font-semibold text-yg-purple-200 transition hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400 sm:inline-flex">
      View all
      <lucide-icon name="arrow-right" [size]="15" aria-hidden="true"></lucide-icon>
    </button>
  </div>

  <div *ngIf="featuredCollection" class="grid gap-4 lg:grid-cols-[1.32fr_1fr]">
    <app-collection-card
      [collection]="featuredCollection"
      [variant]="'featured'"
      [description]="collectionDescription(0)"
      (collectionSelected)="collectionSelected.emit($event)">
    </app-collection-card>

    <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-1">
      <app-collection-card
        *ngFor="let collection of secondaryCollections; let collectionIndex = index"
        [collection]="collection"
        [variant]="'secondary'"
        [description]="collectionDescription(collectionIndex + 1)"
        (collectionSelected)="collectionSelected.emit($event)">
      </app-collection-card>
    </div>
  </div>
</section>
