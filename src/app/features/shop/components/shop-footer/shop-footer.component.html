<footer class="border-t border-white/[0.08] bg-black/30" aria-labelledby="shop-footer-title">
  <div class="mx-auto max-w-[1720px] px-4 py-8 sm:px-6 lg:px-8">
    <div class="grid gap-8 lg:grid-cols-[1.35fr_2fr_1.35fr]">
      <div>
        <div class="flex items-center gap-3">
          <span class="text-2xl font-black tracking-tight text-white">YG</span>
          <h2 id="shop-footer-title" class="text-base font-bold uppercase tracking-wide text-white">Fandom</h2>
        </div>
        <p class="mt-3 max-w-xs text-xs leading-5 text-yg-muted">More than a fandom.</p>

        <div class="mt-5 flex gap-2.5">
          <a class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-white/[0.08] bg-white/[0.04] text-yg-muted transition hover:border-yg-purple-400/50 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400" href="#" aria-label="YG Fandom community chat">
            <lucide-icon name="message-circle" [size]="15" aria-hidden="true"></lucide-icon>
          </a>
          <a class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-white/[0.08] bg-white/[0.04] text-yg-muted transition hover:border-yg-purple-400/50 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400" href="#" aria-label="YG Fandom Instagram">
            <lucide-icon name="instagram" [size]="15" aria-hidden="true"></lucide-icon>
          </a>
          <a class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-white/[0.08] bg-white/[0.04] text-yg-muted transition hover:border-yg-purple-400/50 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400" href="#" aria-label="YG Fandom YouTube">
            <lucide-icon name="youtube" [size]="15" aria-hidden="true"></lucide-icon>
          </a>
          <a class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-white/[0.08] bg-white/[0.04] text-yg-muted transition hover:border-yg-purple-400/50 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400" href="#" aria-label="YG Fandom music">
            <lucide-icon name="music-2" [size]="15" aria-hidden="true"></lucide-icon>
          </a>
        </div>
      </div>

      <nav class="grid grid-cols-2 gap-6 sm:grid-cols-3" aria-label="Shop footer">
        <div *ngFor="let group of linkGroups">
          <p class="text-xs font-bold text-white">{{ group.title }}</p>
          <ul class="mt-3 space-y-2">
            <li *ngFor="let link of group.links">
              <a class="text-xs text-yg-muted transition hover:text-yg-purple-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400" href="#">{{ link }}</a>
            </li>
          </ul>
        </div>
      </nav>

      <div class="rounded-lg border border-white/[0.06] bg-white/[0.035] p-4">
        <p class="text-sm font-bold text-white">Join Our Community</p>
        <p class="mt-1.5 text-xs leading-5 text-yg-muted">Get the latest updates and exclusive drops.</p>
        <form class="mt-4 flex gap-2">
          <label class="sr-only" for="shop-footer-email">Email address</label>
          <input
            id="shop-footer-email"
            type="email"
            placeholder="Enter your email"
            class="min-w-0 flex-1 rounded-md border border-white/[0.08] bg-yg-elevated px-3 py-2 text-xs text-white placeholder:text-yg-muted focus:border-yg-purple-400 focus:outline-none focus:ring-2 focus:ring-yg-purple-400/30">
          <button
            type="submit"
            class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-md bg-yg-purple-500 text-white shadow-glow-sm transition hover:bg-yg-purple-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400"
            aria-label="Join YG Fandom community">
            <lucide-icon name="send" [size]="15" aria-hidden="true"></lucide-icon>
          </button>
        </form>
      </div>
    </div>

    <div class="mt-8 flex flex-col gap-3 border-t border-white/[0.08] pt-5 text-xs text-yg-muted sm:flex-row sm:items-center sm:justify-between">
      <p>© 2026 YG Fandom. All rights reserved.</p>
      <div class="flex gap-5">
        <a class="transition hover:text-yg-purple-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400" href="#">Terms</a>
        <a class="transition hover:text-yg-purple-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400" href="#">Privacy</a>
      </div>
    </div>
  </div>
</footer>
