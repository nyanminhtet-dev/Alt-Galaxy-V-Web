<section class="mx-auto max-w-[1720px] px-4 py-7 sm:px-6 lg:px-8" aria-labelledby="shop-by-category-title">
  <div class="mb-5 flex items-end justify-between gap-4">
    <div>
      <h2 id="shop-by-category-title" class="text-2xl font-bold tracking-normal text-white sm:text-3xl">Shop by Category</h2>
      <p class="mt-1.5 text-sm text-yg-muted">Find exactly what you're looking for.</p>
    </div>

    <a
      routerLink="/shop/products"
      class="hidden items-center gap-1.5 rounded-md px-2 py-1.5 text-xs font-semibold text-yg-purple-200 transition hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400 sm:inline-flex"
      aria-label="View all merchandise">
      View all
      <lucide-icon name="arrow-right" [size]="15" aria-hidden="true"></lucide-icon>
    </a>
  </div>

  <div class="-mx-4 flex snap-x gap-4 overflow-x-auto px-4 pb-2 sm:-mx-6 sm:px-6 lg:mx-0 lg:grid lg:grid-cols-4 lg:overflow-visible lg:px-0">
    <app-category-card
      *ngFor="let category of categories"
      class="min-w-[16rem] snap-start sm:min-w-[18rem] lg:min-w-0"
      [category]="category"
      (categorySelected)="categorySelected.emit($event)">
    </app-category-card>
  </div>
</section>
