<article class="group h-full overflow-hidden rounded-lg border border-white/[0.08] bg-yg-surface transition hover:border-yg-purple-400/50 hover:shadow-glow-sm">
  <button
    type="button"
    class="relative block h-36 w-full text-left focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400 focus-visible:ring-offset-2 focus-visible:ring-offset-yg-bg"
    (click)="collectionSelected.emit(collection)">
    <span class="absolute inset-0 block overflow-hidden">
      <img
        class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
        [src]="collection.image"
        [alt]="collection.imageAlt"
        loading="lazy">
      <span class="absolute inset-0 bg-gradient-to-r from-black/88 via-black/38 to-black/5"></span>
    </span>
    <span class="relative z-10 flex h-full w-full items-start justify-between gap-3 p-4">
      <span>
        <span class="block text-sm font-bold text-white">{{ collection.name }}</span>
        <span class="mt-1.5 block text-xs text-white/78">{{ collection.productCount }} Products</span>
      </span>
      <span class="absolute bottom-3 right-3 flex h-8 w-8 shrink-0 items-center justify-center rounded-full border border-white/15 bg-white/[0.05] text-white/80 backdrop-blur transition group-hover:border-yg-purple-400/60 group-hover:bg-yg-purple-500 group-hover:text-white">
        <lucide-icon name="arrow-right" [size]="15" aria-hidden="true"></lucide-icon>
      </span>
    </span>
  </button>
</article>
