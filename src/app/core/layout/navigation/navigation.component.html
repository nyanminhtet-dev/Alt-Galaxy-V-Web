<header class="sticky top-0 z-50 border-b border-white/[0.06] bg-yg-bg/95 backdrop-blur-xl">
  <nav class="mx-auto flex h-16 max-w-[1720px] items-center justify-between gap-4 px-4 sm:px-6 lg:px-8" aria-label="Primary navigation">
    <a
      routerLink="/shop"
      class="group inline-flex shrink-0 items-center gap-3 rounded-md outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400 focus-visible:ring-offset-2 focus-visible:ring-offset-yg-bg"
      aria-label="YG Fandom home">
      <span class="text-2xl font-black leading-none tracking-[-0.08em] text-white transition group-hover:text-yg-purple-200" aria-hidden="true">YG</span>
      <span class="block text-base font-extrabold uppercase leading-none tracking-wide text-white">Fandom</span>
    </a>

    <div class="hidden items-center gap-6 md:flex">
      <a
        *ngFor="let item of navigationItems"
        [routerLink]="item.route"
        [routerLinkActiveOptions]="{ exact: item.exact === true }"
        routerLinkActive="text-yg-purple-300 after:scale-x-100"
        class="relative py-5 text-sm font-medium text-white/85 transition after:absolute after:inset-x-0 after:bottom-0 after:h-0.5 after:origin-center after:scale-x-0 after:rounded-full after:bg-yg-purple-400 after:transition hover:text-yg-purple-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400 focus-visible:ring-offset-2 focus-visible:ring-offset-yg-bg">
        {{ item.label }}
      </a>
    </div>

    <div class="hidden min-w-0 flex-1 items-center justify-end gap-3 md:flex">
      <label class="relative hidden w-full max-w-[18rem] lg:block">
        <span class="sr-only">Search merchandise</span>
        <input
          type="search"
          class="h-11 w-full rounded-sm border border-white/[0.07] bg-white/[0.045] px-3.5 pr-10 text-xs text-white shadow-inner outline-none transition placeholder:text-yg-muted/80 focus:border-yg-purple-400/50 focus:ring-2 focus:ring-yg-purple-400/25"
          placeholder="Search merchandise...">
        <lucide-icon class="absolute right-3.5 top-1/2 -translate-y-1/2 text-yg-muted" name="search" [size]="16" aria-hidden="true"></lucide-icon>
      </label>

      <div class="inline-flex h-11 items-center gap-2 rounded-sm border border-white/[0.05] bg-white/[0.045] px-3 text-xs font-semibold text-yg-purple-200">
        <lucide-icon name="sparkles" [size]="14" aria-hidden="true"></lucide-icon>
        <span>420</span>
      </div>

      <a
        routerLink="/shop"
        class="relative inline-flex h-9 w-9 items-center justify-center rounded-full text-white transition hover:text-yg-purple-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400 focus-visible:ring-offset-2 focus-visible:ring-offset-yg-bg"
        aria-label="Open cart">
        <lucide-icon name="shopping-cart" [size]="21" aria-hidden="true"></lucide-icon>
        <span class="absolute -right-0.5 -top-0.5 flex h-3.5 min-w-3.5 items-center justify-center rounded-full bg-yg-purple-400 px-1 text-[0.5625rem] font-bold text-white">3</span>
      </a>

      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center overflow-hidden rounded-full border border-white/[0.08] bg-yg-elevated text-yg-muted transition hover:border-yg-purple-400/50 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400 focus-visible:ring-offset-2 focus-visible:ring-offset-yg-bg"
        aria-label="Account">
        <img class="h-full w-full object-cover" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=96&q=80" alt="Profile avatar">
      </button>
    </div>

    <button
      type="button"
      class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-yg-border bg-yg-surface text-yg-muted transition hover:border-yg-purple-400/50 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400 focus-visible:ring-offset-2 focus-visible:ring-offset-yg-bg md:hidden"
      [attr.aria-expanded]="mobileMenuOpen"
      aria-controls="mobile-navigation"
      aria-label="Toggle navigation"
      (click)="toggleMobileMenu()">
      <lucide-icon [name]="mobileMenuOpen ? 'x' : 'menu'" [size]="20" aria-hidden="true"></lucide-icon>
    </button>
  </nav>

  <div
    *ngIf="mobileMenuOpen"
    id="mobile-navigation"
    class="border-t border-yg-border bg-yg-bg px-5 py-3 md:hidden">
    <a
      *ngFor="let item of navigationItems"
      [routerLink]="item.route"
      [routerLinkActiveOptions]="{ exact: item.exact === true }"
      routerLinkActive="border-yg-purple-400/50 bg-yg-surface text-white"
      class="block rounded-md border border-transparent px-3 py-2 text-sm font-medium text-yg-muted transition hover:bg-yg-elevated hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400"
      (click)="closeMobileMenu()">
      {{ item.label }}
    </a>
  </div>
</header>
