<div
  class="relative"
  (click)="$event.stopPropagation()"
  (mouseenter)="openMenu()"
  (mouseleave)="scheduleClose()">
  <button
    type="button"
    class="inline-flex h-10 w-10 items-center justify-center overflow-hidden rounded-full border border-white/[0.08] bg-yg-elevated text-yg-muted transition hover:border-yg-purple-400/50 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400 focus-visible:ring-offset-2 focus-visible:ring-offset-yg-bg"
    aria-label="Open account menu"
    aria-controls="profile-menu"
    [attr.aria-expanded]="isOpen"
    (click)="toggleMenu()"
    (focus)="openMenu()">
    <img class="h-full w-full object-cover" [src]="profileUser.avatarUrl" alt="Profile avatar">
  </button>

  <div
    id="profile-menu"
    class="absolute right-0 top-full z-50 mt-3 w-[19rem] origin-top-right rounded-xl border border-white/[0.08] bg-[#111116] p-2.5 text-white shadow-2xl shadow-black/50 transition duration-200"
    [class.invisible]="!isOpen"
    [class.pointer-events-none]="!isOpen"
    [class.translate-y-1]="!isOpen"
    [class.opacity-0]="!isOpen"
    [class.translate-y-0]="isOpen"
    [class.opacity-100]="isOpen"
    [attr.aria-hidden]="!isOpen"
    role="menu"
    aria-label="Account menu"
    (mouseenter)="cancelClose()"
    (mouseleave)="scheduleClose()">
    <div class="rounded-lg border border-white/[0.06] bg-white/[0.035] p-3.5 text-center">
      <img
        class="mx-auto h-14 w-14 rounded-full border border-yg-purple-300/30 object-cover shadow-lg shadow-yg-purple-900/20"
        [src]="profileUser.avatarUrl"
        alt="Profile avatar">
      <p class="mt-3 text-sm font-semibold text-white">{{ profileUser.name }}</p>
      <p class="mt-0.5 truncate text-xs text-yg-muted">{{ profileUser.identifier }}</p>
    </div>

    <div class="mt-2 space-y-1" role="none">
      <button
        *ngFor="let action of accountActions"
        type="button"
        role="menuitem"
        class="group flex h-11 w-full items-center gap-3 rounded-md px-3 text-left text-sm font-medium text-white/85 transition hover:bg-white/[0.06] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400 focus-visible:ring-offset-2 focus-visible:ring-offset-[#111116]"
        [attr.tabindex]="isOpen ? null : -1"
        (click)="handleAction(action)">
        <span class="inline-flex h-7 w-7 items-center justify-center rounded-md border border-white/[0.06] bg-white/[0.04] text-yg-purple-200 transition group-hover:border-yg-purple-400/40 group-hover:bg-yg-purple-500/10">
          <lucide-icon [name]="action.iconName" [size]="15" aria-hidden="true"></lucide-icon>
        </span>
        <span>{{ action.label }}</span>
      </button>
    </div>

    <div class="mt-2 border-t border-white/[0.08] pt-2" role="none">
      <button
        type="button"
        role="menuitem"
        class="group flex h-11 w-full items-center gap-3 rounded-md px-3 text-left text-sm font-medium text-white/80 transition hover:bg-white/[0.06] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yg-purple-400 focus-visible:ring-offset-2 focus-visible:ring-offset-[#111116]"
        [attr.tabindex]="isOpen ? null : -1"
        (click)="handleLogout()">
        <span class="inline-flex h-7 w-7 items-center justify-center rounded-md border border-white/[0.06] bg-white/[0.04] text-yg-muted transition group-hover:border-yg-purple-400/40 group-hover:text-yg-purple-200">
          <lucide-icon name="log-out" [size]="15" aria-hidden="true"></lucide-icon>
        </span>
        <span>Log Out</span>
      </button>
    </div>
  </div>
</div>
